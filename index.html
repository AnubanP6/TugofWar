<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Exam Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#4f46e5;--bg2:#9333ea;
  --card:#ffffff;--ink:#1b1740;--muted:#5b5b80;--line:#e3e0f5;--field:#f4f2ff;--btn:#ffffff;
  --gold:#fbbf24;--vh:1vh;
}
@supports (height:1dvh){:root{--vh:1dvh}}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#171340;--bg2:#2a1258;
    --card:#1e1b4b;--ink:#f1efff;--muted:#a9a6d6;--line:#3a3670;--field:#151238;--btn:#2a2660;
  }
}
:root[data-theme="dark"]{
  --bg1:#171340;--bg2:#2a1258;
  --card:#1e1b4b;--ink:#f1efff;--muted:#a9a6d6;--line:#3a3670;--field:#151238;--btn:#2a2660;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;
  color:#fff;min-height:calc(100*var(--vh));
  background:var(--bg1);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  overscroll-behavior-y:contain;
}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hidden{display:none!important}
.wrap{max-width:480px;margin:0 auto;min-height:calc(100*var(--vh));padding:14px max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;padding:4px;object-fit:contain;border:2px solid rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.brand h1{margin:0;font-size:20px;font-weight:700;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.brand h1 span{color:var(--gold)}
.chips{display:flex;gap:6px;flex:none}
.chip{border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:16px}
.chip:active{background:rgba(255,255,255,.28)}

/* ---------- buttons/cards ---------- */
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 6px 0 rgba(0,0,0,.2),0 16px 28px rgba(0,0,0,.22)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:17px;background:#e7e4fb;color:#1b1740;box-shadow:0 4px 0 rgba(0,0,0,.25);width:100%;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.gold{background:var(--gold);color:#3b2400;font-size:18px}
.btn.ghost{background:var(--field);box-shadow:none;border:2px solid var(--line)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--field);color:var(--ink)}
input:focus{outline:3px solid var(--gold);outline-offset:1px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--muted)}

/* ---------- home / set picker ---------- */
.namecard{display:flex;gap:8px;align-items:flex-end}
.namecard .field{flex:1}
h2{margin:0 0 4px;font-size:19px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px;line-height:1.4}
.setlist{display:grid;gap:10px}
.setcard{background:var(--field);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.setcard .swatch{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff}
.setcard .meta{flex:1;min-width:0}
.setcard .meta b{display:block;font-size:16px;line-height:1.25}
.setcard .meta span{display:block;font-size:13px;color:var(--muted)}
.setcard button{flex:none;width:auto;padding:9px 16px;font-size:15px}
.netstatus{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.netstatus.off{color:#dc2626;font-weight:600}

/* ---------- countdown ---------- */
.countdown{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle,rgba(30,15,90,.8),rgba(15,8,50,.94))}
.cdnum{font-size:min(38vw,160px);font-weight:700;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.3),0 0 50px var(--gold)}
.cdnum.go{color:var(--gold);font-size:min(20vw,100px)}
.cdnum.pop{animation:cdpop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cdpop{0%{transform:scale(2.4);opacity:0}30%{opacity:1}100%{transform:scale(1)}}

/* ---------- game screen ---------- */
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.scorebox{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px;line-height:1.1}
.scorebox small{display:block;font-size:11px;font-weight:500;opacity:.85}
.streakbox{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-weight:700;font-size:15px}
.streakbox.hot{background:rgba(251,146,60,.4)}
.progress{display:flex;gap:4px;margin-bottom:10px}
.progress i{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.25)}
.progress i.done{background:#4ade80}
.progress i.cur{background:#fff}

.timerwrap{display:flex;justify-content:center;margin-bottom:10px}
.timerbox{position:relative;width:74px;height:74px}
.timerbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbg{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.3);stroke-width:9}
.ringfg{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:0;transition:stroke-dashoffset .08s linear}
.timerbox.low .ringfg{stroke:#ff5252}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700}

.qcard{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;text-align:center;margin-bottom:12px;box-shadow:0 6px 0 rgba(0,0,0,.2),0 16px 28px rgba(0,0,0,.22)}
.qtext{font-size:clamp(18px,5.4vw,24px);font-weight:700;line-height:1.28;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.answers{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:10px;text-align:left;min-height:56px;padding:10px 14px;border:0;border-radius:16px;background:var(--btn);color:var(--ink);
  font-size:16px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.ans .key{flex:none;width:26px;height:26px;border-radius:8px;background:#6d5ad0;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.ans.correct{background:#22c55e;color:#fff}
.ans.correct .key{background:#fff;color:#15803d}
.ans.wrong{background:#9ca3af;color:#fff;text-decoration:line-through}
.ans.dim{opacity:.5}
.answers.locked .ans{pointer-events:none}
.pop{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:30;font-size:30px;font-weight:700;color:#4ade80;text-shadow:0 3px 0 rgba(0,0,0,.35);pointer-events:none;animation:popfloat 1s ease-out forwards}
.pop.bad{color:#f87171}
@keyframes popfloat{0%{transform:translate(-50%,20px) scale(.6);opacity:0}25%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{transform:translate(-50%,-40px) scale(1);opacity:0}}

/* ---------- bonus egg ---------- */
.eggwrap{background:var(--card);color:var(--ink);border-radius:22px;padding:26px 18px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2),0 16px 28px rgba(0,0,0,.22)}
.eggtitle{font-size:20px;font-weight:700;margin-bottom:4px}
.eggsub{color:var(--muted);font-size:14px;margin-bottom:18px}
.eggs{display:flex;justify-content:center;gap:16px;margin-bottom:6px}
.egg{width:78px;height:96px;border:0;background:none;position:relative;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.egg svg{width:100%;height:100%}
.egg:active{transform:scale(.95)}
.egg.cracked{pointer-events:none}
.egg.shake{animation:eggshake .5s ease-in-out}
@keyframes eggshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.boostreveal{margin-top:14px;font-size:19px;font-weight:700;color:#b45309;min-height:1.4em}
.boostreveal.show{animation:boostpop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes boostpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- results / leaderboard ---------- */
.resultbig{text-align:center;padding:8px 0 4px}
.trophy{font-size:56px;line-height:1}
.finalscore{font-size:40px;font-weight:700;margin:4px 0}
.finalsub{color:var(--muted);font-size:14px;margin-bottom:4px}
.statsrow{display:flex;gap:10px;margin:14px 0}
.statbox{flex:1;background:var(--field);border-radius:14px;padding:10px;text-align:center}
.statbox b{display:block;font-size:20px}
.statbox span{font-size:12px;color:var(--muted)}
.lbheader{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px}
.lblist{display:grid;gap:6px;max-height:min(46vh,360px);overflow-y:auto;padding-right:2px}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:12px;padding:7px 12px;font-size:15px}
.lbrow .pos{width:26px;text-align:center;font-weight:700}
.lbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lbrow .sc{font-weight:700;color:#b45309}
.lbrow.me{background:rgba(251,191,36,.3);border:2px solid var(--gold)}
.lbmsg{color:var(--muted);font-size:14px;text-align:center;padding:14px 0}
.actionsrow{display:grid;gap:8px;margin-top:10px}

canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (prefers-reduced-motion: reduce){.cdnum.pop,.boostreveal.show,.egg.shake,.pop{animation:none!important}}
</style>
</head>

/* ================= parsing ================= */
function parseSet(text){
  const list = [];
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim(); if(!line || line.startsWith('#')) return;
    const p = line.split('|').map(s => s.trim());
    const q = p[0], correct = p[1], wrong = p.slice(2).filter(w => w && w !== correct);
    if(q && correct && wrong.length) list.push({q, correct, wrong});
  });
  return list;
}

let AC = null, master = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value=.55; master.connect(AC.destination);}catch(e){AC=null;} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,o){ if(muted) return; const c=ac(); if(!c) return; o=o||{}; const type=o.type||'sine',vol=o.vol==null?.25:o.vol,when=o.when||0,slide=o.slide||0;
  const t=c.currentTime+when, osc=c.createOscillator(), g=c.createGain(); osc.type=type; osc.frequency.setValueAtTime(f,t);
  if(slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g); g.connect(master); osc.start(t); osc.stop(t+d+.03); }

/* ================= confetti ================= */
const cv=$('confetti'), cx=cv.getContext('2d'); let parts=[], cRaf=0; const DPR=Math.min(2,window.devicePixelRatio||1);
const ALLC=['#ef4444','#3b82f6','#fbbf24','#22c55e','#a855f7','#ec4899','#ffffff'];
function sizeCv(){ cv.width=Math.floor(innerWidth*DPR); cv.height=Math.floor(innerHeight*DPR); } addEventListener('resize',sizeCv); sizeCv();
function burst(x,y,n,o){ o=o||{}; const spread=o.spread==null?Math.PI*2:o.spread, angle=o.angle==null?-Math.PI/2:o.angle, speed=o.speed||9, colors=o.colors||ALLC;
  for(let i=0;i<n;i++){ const a=angle+(Math.random()-.5)*spread, s=speed*(.5+Math.random());
    parts.push({x:x*DPR,y:y*DPR,vx:Math.cos(a)*s*DPR,vy:Math.sin(a)*s*DPR,w:(6+Math.random()*7)*DPR,h:(4+Math.random()*6)*DPR,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[Math.floor(Math.random()*colors.length)],round:Math.random()<.25,life:0,max:100+Math.random()*60}); }
  if(parts.length>700) parts.splice(0,parts.length-700); if(!cRaf) cRaf=requestAnimationFrame(cLoop); }
function cLoop(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(p=>p.life<p.max && p.y<cv.height+40);
  for(const p of parts){ p.life++; p.vy+=.28*DPR; p.vx*=.992; p.vy*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.globalAlpha=Math.max(0,Math.min(1,(p.max-p.life)/28));
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2.2,0,7);cx.fill();} else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); }
  cRaf = parts.length ? requestAnimationFrame(cLoop) : 0; }

function countdown(my){
  return new Promise(res => {
    const ov = $('countdown'), num = $('cdnum'); const seq = ['3','2','1','GO!']; let i = 0;
    ov.classList.remove('hidden');
    const step = () => {
      if(my !== token){ ov.classList.add('hidden'); return; }

      if(i<3) sfx.beep(); else sfx.go();
      i++; setTimeout(step, i===4?650:750);

}

}

function nextQuestion(){
  if(qi >= deck.length){ finishRun(); return; }
  cur = deck[qi]; qi++;
  order = shuffle([cur.correct, ...shuffle(cur.wrong).slice(0,3)]);
  state = 'question';
  updateProgress();
  $('qtext').textContent = cur.q;
  const grid = $('answers'); grid.innerHTML = ''; grid.classList.remove('locked');
  const letters = ['A','B','C','D'];
  order.forEach((opt,i) => {
    const b = document.createElement('button'); b.type='button'; b.className='ans';
    const k = document.createElement('span'); k.className='key'; k.textContent = letters[i];
    const s = document.createElement('span'); s.textContent = opt;
    b.append(k,s); b.addEventListener('click', () => answer(i)); grid.appendChild(b);
  });
  startTimer();
}
function effectiveTime(){ return TIME_MS + (boostTime.left>0 ? boostTime.add : 0); }
function startTimer(){
  cancelAnimationFrame(rafId); t0 = performance.now(); lastSec = -1;
  const ring = $('ringfg'), num = $('tnum'), box = $('timerbox'); const total = effectiveTime();
  box.classList.remove('low');
  const RINGLEN = 220;
  const loop = () => {
    if(state !== 'question') return;
    const left = Math.max(0, total - (performance.now()-t0));
    ring.style.strokeDashoffset = RINGLEN * (1 - left/total);
    const sec = Math.ceil(left/1000);
    if(sec !== lastSec){ lastSec = sec; num.textContent = sec; if(sec<=2 && sec>0){ box.classList.add('low'); sfx.tick(); } }
    if(left <= 0){ answer(-1); return; }
    rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}
function popText(text, bad){
  const p = document.createElement('div'); p.className = 'pop' + (bad?' bad':''); p.textContent = text;
  document.body.appendChild(p); setTimeout(()=>p.remove(), 1050);

function answer(i){

  state = 'reveal'; cancelAnimationFrame(rafId);
  const grid = $('answers'); grid.classList.add('locked');
  const elapsed = performance.now() - t0, total = effectiveTime();
  const chosen = i>=0 ? order[i] : null;
  const ok = chosen === cur.correct;
  Array.from(grid.children).forEach((b,bi) => {
    if(order[bi] === cur.correct) b.classList.add('correct');
    else if(bi === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(ok){
    streak++; correctCount++; bestStreakRun = Math.max(bestStreakRun, streak);
    const remainFrac = Math.max(0, 1 - elapsed/total);
    let pts = Math.round(BASE_MIN + (BASE_MAX-BASE_MIN)*remainFrac);
    const streakMult = 1 + Math.min(streak,10)*0.1;
    let mult = streakMult;
    if(boostMult.left>0){ mult *= boostMult.factor; }
    pts = Math.round(pts * mult);
    score += pts; renderScore();
    sfx.correct(remainFrac>0.6);
    popText('+'+pts, false);
    burst(innerWidth/2, innerHeight*0.35, 22, {speed:7});
  } else {
    streak = 0;
    if(chosen === null) sfx.timeout(); else sfx.wrong();
    popText(chosen===null ? "Time's up" : 'Not quite', true);
  }
  if(boostMult.left>0) boostMult.left--;
  if(boostTime.left>0) boostTime.left--;
  renderStreak();

  const eggMilestone = streak>0 && streak%4===0 && streak>lastEggAt;
  later(() => {
    if(eggMilestone){ lastEggAt = streak; showEgg(); }
    else nextQuestion();
  }, 900);
}

/* ---- bonus egg ---- */
const BOOSTS = [
  {type:'points', label:t=>'🎁 +'+t.value+' bonus points!', value:400},
  {type:'mult',   label:t=>'⚡ 2× points for the next 3 questions!', value:2, dur:3},
  {type:'time',   label:t=>'⏱ +4 seconds for the next 3 questions!', value:4000, dur:3}
];
function showEgg(){
  state = 'egg';
  $('answers').parentElement; // no-op, keep structure
  $('answers').classList.add('hidden');
  document.querySelector('.qcard').classList.add('hidden');
  document.querySelector('.timerwrap').classList.add('hidden');
  const wrap = $('eggwrap'); wrap.classList.remove('hidden');
  $('boostreveal').textContent = ''; $('boostreveal').classList.remove('show');
  $('eggContinueRow').classList.add('hidden');
  const box = $('eggs'); box.innerHTML = '';
  for(let i=0;i<3;i++){
    const b = document.createElement('button'); b.className = 'egg'; b.type = 'button'; b.setAttribute('aria-label','Crack egg ' + (i+1));
    b.innerHTML = `<svg viewBox="0 0 80 96"><ellipse cx="40" cy="50" rx="34" ry="44" fill="#fde68a" stroke="#b45309" stroke-width="3"/><ellipse cx="40" cy="50" rx="34" ry="44" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="2 6" opacity=".6"/></svg>`;
    b.addEventListener('click', () => crackEgg(b));
    box.appendChild(b);
  }
  sfx.egg();
}
function crackEgg(btn){
  if(state !== 'egg') return; state = 'eggcracking';
  Array.from($('eggs').children).forEach(e => { if(e!==btn) e.classList.add('cracked'); });
  btn.classList.add('shake'); sfx.crack();
  later(() => {
    const boost = BOOSTS[Math.floor(Math.random()*BOOSTS.length)];
    if(boost.type==='points') score += boost.value, renderScore();
    else if(boost.type==='mult') boostMult = {left:boost.dur, factor:boost.value};
    else if(boost.type==='time') boostTime = {left:boost.dur, add:boost.value};
    const rv = $('boostreveal'); rv.textContent = boost.label(boost); rv.classList.add('show');
    sfx.boost(); burst(innerWidth/2, innerHeight*0.4, 40, {speed:9});
    $('eggContinueRow').classList.remove('hidden');
  }, 500);
}
$('eggContinue').addEventListener('click', () => {
  $('eggwrap').classList.add('hidden');
  $('answers').classList.remove('hidden');
  document.querySelector('.qcard').classList.remove('hidden');
  document.querySelector('.timerwrap').classList.remove('hidden');
  state = 'reveal';
  nextQuestion();
});

/* ================= results & leaderboard ================= */
function finishRun(){
  state = 'over';
  setBestLocal(curSet.id, score);
  $('finalScore').textContent = score;
  $('finalSub').textContent = curSet.name;
  $('statBest').textContent = bestLocal(curSet.id);
  $('statStreak').textContent = bestStreakRun;
  $('statCorrect').textContent = correctCount + '/' + deck.length;
  $('lbTitle').textContent = curSet.name + ' — Top scores';
  showView('results');
  if(score > 0) bigConfettiIfGreat();
  submitScore().then(() => loadLeaderboard());
}
function bigConfettiIfGreat(){
  if(bestStreakRun>=6 || score>=6000){ sfx.submit(); burst(innerWidth/2, 60, 60, {spread:Math.PI*.7, angle:Math.PI/2, speed:6}); }
}
async function submitScore(){
  if(!dbReady || !db) return;
  try{
    await fs.addDoc(fs.collection(db,'scores'), {
      setId: curSet.id, name: nickname || 'Anonymous',
      score: Math.round(score), streak: Math.round(bestStreakRun),
      ts: fs.serverTimestamp()
    });
  }catch(e){ console.error('submitScore failed', e); }
}
async function loadLeaderboard(){
  const list = $('lblist'), status = $('lbstatus');
  list.innerHTML = ''; status.textContent = '';
  if(!dbReady || !db){ status.textContent = 'Leaderboard unavailable right now.'; status.classList.add('off'); return; }
  status.textContent = 'Loading…';
  try{
    const q = fs.query(fs.collection(db,'scores'), fs.where('setId','==',curSet.id), fs.orderBy('score','desc'), fs.limit(20));
    const snap = await fs.getDocs(q);
    status.textContent = '';
    if(snap.empty){ list.innerHTML = '<div class="lbmsg">No scores yet for this topic — you could be first!</div>'; return; }
    let rank = 0;
    snap.forEach(doc => {
      rank++; const d = doc.data();
      const row = document.createElement('div'); row.className = 'lbrow' + (d.name===nickname && d.score===score ? ' me' : '');
      row.innerHTML = `<span class="pos">${rank<=3 ? ['🥇','🥈','🥉'][rank-1] : rank}</span><span class="nm"></span><span class="sc"></span>`;
      row.querySelector('.nm').textContent = d.name || 'Anonymous';
      row.querySelector('.sc').textContent = d.score;
      list.appendChild(row);
    });
  }catch(e){
    console.error('loadLeaderboard failed', e);
    status.textContent = 'Could not load the leaderboard (check your connection).'; status.classList.add('off');
  }
}

/* ================= events ================= */
$('saveName').addEventListener('click', saveNickname);
$('nickname').addEventListener('blur', saveNickname);
$('nickname').addEventListener('keydown', e => { if(e.key==='Enter'){ saveNickname(); e.target.blur(); } });
$('quitBtn').addEventListener('click', () => { token++; cancelAnimationFrame(rafId); state='home'; showView('home'); buildSetList(); });
$('playAgain').addEventListener('click', () => startRun(curSet));
$('backHome').addEventListener('click', () => { showView('home'); buildSetList(); });
$('lbRefresh').addEventListener('click', loadLeaderboard);
$('muteBtn').addEventListener('click', () => { muted=!muted; setMuteLabel(); const s=store.get()||{}; s.muted=muted; store.set(s); if(!muted){ ac(); sfx.beep(); } });
$('fsBtn').addEventListener('click', () => { try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} });
addEventListener('online', () => updateNetStatus($('netstatus')));
addEventListener('offline', () => updateNetStatus($('netstatus')));

/* ================= init ================= */
if(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) $('fsBtn').classList.remove('hidden');
loadHome();
initFirebase();
</script>
